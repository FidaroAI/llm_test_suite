[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmeval"
version = "0.1.0"
description = "Cache-key-centric LLM evaluation suite: decoupled generation, running, grading, comparison."
requires-python = ">=3.10"
# Two first-class entry points ship from this project: `llmeval` (the plumbing) and
# `llmevalx` (the interactive front end). Their shared deps are therefore core deps —
# questionary is what `llmevalx` is built out of, so it is not optional. litellm stays
# optional and lazy-imported, so the core (cache, store, assertions, stats, reports) is
# usable and testable without it installed.
dependencies = [
    "pydantic>=2.5",
    "jinja2>=3.1",
    "questionary>=2.0",
]

[project.optional-dependencies]
# Needed only to actually call real LLM providers. httpx is listed explicitly rather
# than leaned on as a litellm transitive: the streaming provider imports it directly.
providers = ["litellm>=1.40", "httpx>=0.27"]
# Needed only by plugins that reach the network: the stock_prices live Stooq fetch, and the
# dataset plugins' Hugging Face downloads.
network = ["requests>=2.28"]
dev = ["pytest>=8.0", "pylint>=3.0"]

[project.scripts]
llmeval = "llmeval.cli:main"
llmevalx = "llmevalx:main"

[tool.setuptools.packages.find]
where = ["."]
# Both packages ship. `reporting` does not: it is a generic CSV->HTML renderer invoked as
# `python -m reporting.csv_table` from the project directory, not an entry point. Neither
# does `testcases/`, despite holding importable packages — the plugins in it are user
# content belonging to a project, not code this wheel provides.
include = ["llmeval*", "llmevalx*"]

[tool.pytest.ini_options]
testpaths = ["framework_tests", "reporting_tests", "llmevalx_tests"]
addopts = "-q"
# `llmeval` and `llmevalx` are importable via the editable install; `reporting` is not
# installed, so rootdir goes on sys.path. This lives here rather than in a
# reporting_tests/conftest.py because pytest imports every conftest under the top-level name
# `conftest`, and a second one would shadow framework_tests/conftest.py's helpers.
pythonpath = ["."]

[tool.pylint.main]
# The *_tests dirs hold pytest tests; lint the shipped code proper.
ignore = ["framework_tests", "reporting_tests", "llmevalx_tests"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",  # store row dataclasses are plain data records
    "import-outside-toplevel",       # litellm/tiktoken are lazy-imported on purpose
    "duplicate-code",
    "redefined-builtin",             # assertion grader params named `type` mirror the spec field
]

[tool.pylint.design]
max-args = 12
max-positional-arguments = 12
max-locals = 30  # report/store assembly functions are local-heavy by nature

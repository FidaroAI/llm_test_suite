id: "providers/bedrock_converse_structured.js"
label: bedrock_mantle
config:
  modelId: "{{ env.BEDROCK_MODEL_ID }}"
  region: "{{ env.AWS_REGION }}"
  maxTokens: 5000
  temperature: 0.7
  # AWS credentials are picked up from the standard AWS credential chain:
  # AWS_PROFILE, AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, IAM role, etc.
  # No bearer token needed.

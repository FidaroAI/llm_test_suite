# Venice competitor provider, driven by run_comparison.py.
#
# Like the dynamic Fidaro providers, the model is templated from a
# COMPARISON_VENICE_* env var (keeps promptfoo's request cache key model-aware).
# Venice is a DIRECT external API: no plaintext gateway, web-fetch sidecar, or
# Phala redeploy is involved. Web search is a Venice-specific body param;
# promptfoo's openai:chat provider forwards vendor params only via
# config.passthrough (it is spread verbatim into the request body — there is no
# config.body for this provider). Verified against promptfoo 0.121.12.
#
# Requires VENICE_INFERENCE_KEY in the environment. COMPARISON_VENICE_WEB_SEARCH
# is set by run_comparison.py ("on"/"off"); it defaults to "off" when the config
# omits provider-options.venice.web_search. Keep these env var names in sync with
# scripts_repo/providers_registry.py and scripts_repo/run_comparison.py.
id: "openai:chat:{{ env.COMPARISON_VENICE_MODEL }}"
label: venice_dynamic
config:
  apiBaseUrl: https://api.venice.ai/api/v1
  apiKey: "{{ env.VENICE_INFERENCE_KEY }}"
  passthrough:
    venice_parameters:
      enable_web_search: "{{ env.COMPARISON_VENICE_WEB_SEARCH }}"

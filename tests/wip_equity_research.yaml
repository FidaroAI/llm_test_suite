- description: "Equity research"
  prompts: [system_and_user]
  vars:
    user: file://user_prompts/equity_research_apple.txt
    system: file://system_prompts/fidaro_prod_no_capabilities.txt
  assert:
    # - type: cost
    #   threshold: 0.001
    - type: word-count
      value:
        min: 100
    - type: python
      value: file://assertions/assert_token_count.py
      config:
        # `unit: chars` works out of the box. Switch to `unit: tokens` (default)
        # once tiktoken can reach openaipublic.blob.core.windows.net to download
        # the encoding (one-time, then cached at ~/.cache/tiktoken).
        unit: chars
        min_tokens: 600
    - type: contains-all
      value:
        - "Executive Summary"
        - "Segment Deep Dive"
        - "Financial Health"
        - "Bull/Bear Scenarios"
        - "Pre-Mortem"
        - "Data Integrity"
    - type: python
      value: file://assertions/assert_reasoning_iterations.py
      config:
        min: 3
    - type: llm-rubric
      value: "Evaluate how well the response meets the instructions given in this user prompt: {{user}}"
      # TODO: Fix this:
      # provider: openai:gpt-5
      provider: openai:codex-sdk
      # provider: anthropic:claude-sonnet-4-5-20250929
      # provider: google:gemini-2.5-pro
      # provider: google-vertex:gemini-2.5-pro
      # provider: mistral:mistral-large-latest
      # provider: openai:openai/gpt-5
      threshold: 0.5


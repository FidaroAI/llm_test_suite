description: "Fidaro model eval suite"

# extensions:
#   - file://hooks/before_each.py:before_each

providers:
  # Test against prod phala using a locally running plaintext gateway. You must start the gateway
  # first. This provider can't do that automatically.
  - file://providers/fidaro_plaintext_gateway_phala_prod.yaml
  # Test against dev phala using a locally running plaintext gateway. You must start the gateway
  # first. This provider can't do that automatically.
  - file://providers/fidaro_plaintext_gateway_phala_dev.yaml
  # Dynamic prod/dev providers driven by run_comparison.py. Unlike the static YAML providers above,
  # their model/temperature/max_tokens are templated from COMPARISON_{PROD,DEV}_* env vars that
  # run_comparison.py sets per run (from the comparison config's {prod,dev}-provider-options), so
  # they reflect a gateway/model the run reconfigured. Only meaningful when driven by
  # run_comparison.py (which sets those env vars and starts the gateways).
  - file://providers/fidaro_plaintext_gateway_phala_dynamic_prod.yaml
  - file://providers/fidaro_plaintext_gateway_phala_dynamic_dev.yaml
  # Venice competitor (direct API; no gateway). Driven by run_comparison.py, which sets
  # COMPARISON_VENICE_* and requires VENICE_INFERENCE_KEY. See the YAML header for details.
  - file://providers/venice_dynamic.yaml
  # Use this for testing against a local dstack and local vllm. The only real difference in the
  # provider config is the model name.
  # - file://providers/fidaro_plaintext_gateway_local.yaml
  # Use this for testing directly against the phala vllm endpoint. Not super useful right now.
  - file://providers/fidaro_vllm_phala.yaml

prompts:
  # Simple template for specifying the user prompt.
  - id: file://prompt_templates/user_only.json
    label: user_only
  # This template allows you to specify the system prompt as well. This can't be used when
  # testing against the plaintext gateway as the gateway will always set the system prompt
  # to the Fidaro systme prompt.
  # - id: file://prompt_templates/system_and_user.json
  #   label: system_and_user

defaultTest:
  options:
    cache: true
    # NOTE: the reasoning-block strip (hooks/strip_before_triple_newline.py) is
    # deliberately NOT wired here as a global output transform. A global transform
    # overwrites the canonical response.output, discarding the model's pre-strip
    # response. Instead the strip is attached to every assertion's `transform` in
    # tests/classification.py (augment), so graders see the stripped final answer
    # while the stored response.output keeps the full, pre-strip text.
    #
    # LLM-as-judge for any `llm-rubric` assertions (e.g. the research_rubrics
    # and agentharm_refusal suites). AWS Bedrock so the same config works both
    # locally and in CI; credentials come from the standard AWS chain
    # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION, or AWS_PROFILE).
    # The model id is pinned (not env-templated) so grading stays comparable
    # across runs. Claude Haiku 4.5 via the us. cross-region inference profile
    # (3.5 Haiku is flagged Legacy on Bedrock); temperature 0 for deterministic
    # verdicts. Override per-run with --grader.
    provider:
      id: bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0
      config:
        region: "{{ env.AWS_REGION }}"
        temperature: 0
    # Example of an assertion that would be applied to every test.
  # assert:
  #   - type: python
  #     value: file://assertions/assert_no_censorship.py


tests:
  # Simple single-fact questions graded with an `icontains` assertion on the
  # expected answer. Generated from tests/simple_facts.csv via the shared
  # csv_suite helper. Tagged metadata.suite=simple_facts.
  - file://tests/simple_facts_gen.py:generate_tests
  # Regression watchlist prompts (also CSV-backed). Suite name follows the
  # filename convention, so these are tagged metadata.suite=simple_facts_regressions
  # (the CSV itself mislabels them simple_facts).
  - file://tests/simple_facts_regressions_gen.py:generate_tests
  # Research-style prompts graded against weighted rubrics (one llm-rubric
  # assertion per criterion). Tagged metadata.suite=research_rubrics so they can
  # be run in isolation: --filter-metadata "suite=research_rubrics".
  # Requires `npm run dataset:researchrubrics` to have been run first.
  - file://tests/research_rubrics_gen.py:generate_tests
  # Refusal-rate suite over the AgentHarm safety benchmark: one fixed llm-rubric
  # per test ("the model should not have refused..."), so a PASS means the model
  # did not refuse. Tagged metadata.suite=agentharm_refusal for isolation.
  # Requires `npm run dataset:agentharm` to have been run first.
  - file://tests/agentharm_refusal_gen.py:generate_tests
  # Up-to-date-data check: asks Fidaro for the latest price of 20 stocks across
  # seven exchanges and passes only if the answer is within 1% of the live price.
  # The live reference is fetched up front (from Stooq) by
  # scripts_repo/fetch_stock_prices.py (NOT by the generator), so a source outage
  # can't break other suites' runs.
  # Tagged metadata.suite=stock_prices. Run via scripts_test/fidaro_stock_prices.sh,
  # which fetches prices first then filters to this suite. Off by default (not in
  # the default suite-generation config), so ordinary runs emit zero stock tests.
  - file://tests/stock_prices_gen.py:generate_tests
  # Multifaceted-Bench (kaist-ai/Multifaceted-Bench): preference-following
  # prompts graded against multiple rubric criteria. The dataset rates 1-5, so
  # each test carries a rubricPrompt override that normalizes the judge's 1-5
  # rating to a 0-1 score (scoped to this suite only). Tagged
  # metadata.suite=multifaceted. Requires `npm run dataset:multifaceted` first.
  - file://tests/multifaceted_gen.py:generate_tests

evaluateOptions:
  # TODO: I have no idea what's reasonable here for Fidaro!
  maxConcurrency: 100

outputPath: results/local/latest.json
